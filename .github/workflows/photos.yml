name: Fetch kitchen photos
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['scripts/photos.json', 'scripts/fetch-photos.mjs', '.github/workflows/photos.yml']
permissions:
  contents: write
jobs:
  photos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node scripts/fetch-photos.mjs
      - name: Commit photos
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898+github-actions[bot]@users.noreply.github.com"
          git add img/kitchen
          git diff --cached --quiet || git commit -m "Kitchen photos from Pexels (scripts/photos.json)"
          git push
